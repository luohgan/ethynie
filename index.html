<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le retour des dieux</title>
  <meta name="description" content="Saga de fantasy en sept tomes dans le monde d'Ethynie, par Stéphane Jeanneteau.">
  <style>
    :root { --bg: #14121a; --fg: #ece6d8; --accent: #c9a25b; --muted: #a59f92; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font-family: Georgia, "Times New Roman", serif; padding: 16px; text-align: center; }
    h1 { font-size: clamp(2rem, 6vw, 3.5rem); margin: 0 0 .5rem; color: var(--accent); letter-spacing: .02em; }
    p { margin: .25rem 0; color: var(--muted); font-size: 1.1rem; }
    .soon { margin-top: 2rem; font-style: italic; }
  </style>
</head>
<body>
  <main>
    <h1>Le retour des dieux</h1>
    <p>Une saga de fantasy en sept tomes dans le monde d'Ethynie</p>
    <p>par Stéphane Jeanneteau</p>
    <p class="soon">Site en construction</p>
  </main>
</body>
</html>
